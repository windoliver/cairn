# cargo-audit configuration for Cairn.
# See https://docs.rs/cargo-audit/latest/cargo_audit/config/struct.AuditConfig.html
#
# Advisories ignored here must also be ignored in deny.toml [advisories]
# section. Review at every dependency upgrade — remove once the
# transitive chains are gone.

[advisories]
ignore = [
    # RUSTSEC-2024-0436: `paste` 1.0.x is unmaintained; pulled in
    # transitively via gemm → candle-core → cairn-embeddings-local.
    # Informational, not a CVE. Tracked for update (#48).
    "RUSTSEC-2024-0436",
    # RUSTSEC-2024-0384: `instant` crate unmaintained; no safe upgrade.
    # RUSTSEC-2025-0012: `backoff` crate unmaintained; no safe upgrade.
    # Chain: async-openai → backoff → instant (cairn-llm-openai-compat only).
    "RUSTSEC-2024-0384",
    "RUSTSEC-2025-0012",
]
