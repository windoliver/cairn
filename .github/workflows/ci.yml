name: ci

# Core build/test pipeline. Required status checks for `main`.
#
# Jobs are intentionally split so a failure tells reviewers exactly where to
# look (formatting vs. lint vs. test vs. boundary vs. docs). Job names are
# the contract that branch protection references — see docs/ci.md.
#
# Security posture:
#   - Workflow-level `permissions: contents: read` (least privilege).
#   - All third-party actions pinned to immutable commit SHAs; the comment
#     after each `uses:` records the human-readable tag at pin time.
#   - No secrets are referenced; everything runs against the public toolchain.
#   - `cargo --locked` everywhere to prevent silent dependency updates.

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: format / cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  lint:
    name: lint / cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: lint
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: test-${{ matrix.os }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        # Avoid taiki-e/install-action@v2.75.21's BASH_FUNC_ guard which
        # currently false-positives on the GitHub-hosted runner image. Same
        # workaround as supply-chain.yml (cargo-machete).
        run: cargo install cargo-nextest --locked --version 0.9.136
      - name: cargo nextest run --workspace
        # macOS runners can leave the `cargo` shim resolving through
        # rustup-init after install-action updates ~/.cargo/bin. Call the
        # installed nextest binary directly; install-action verifies this
        # exact entrypoint before the step runs.
        run: cargo-nextest nextest run --workspace --locked --no-fail-fast
      - name: cargo test --doc --workspace
        run: cargo test --doc --workspace --locked

  core-boundary:
    name: invariant / cairn-core dep-freeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo metadata
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: core-boundary
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: scripts/check-core-boundary.sh
        run: ./scripts/check-core-boundary.sh

  gates:
    name: gates / latency + memory + privacy + SRE smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            cmd: "all"
          - runner: macos-latest
            cmd: "all --skip memory"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: gates-${{ matrix.runner }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build cairn + cairn-bench binaries
        # Build both binaries explicitly. The bench harness shells out to the
        # `cairn` CLI via the CAIRN_BIN_PATH baked by build.rs; without an
        # explicit cargo build for cairn-cli, a cold or restored cache can
        # leave target/release/cairn missing or stale.
        run: |
          cargo build --release --locked -p cairn-cli --bin cairn
          cargo build --release --locked -p cairn-bench
          test -x ./target/release/cairn || { echo "missing target/release/cairn after build"; exit 1; }
          test -x ./target/release/cairn-bench || { echo "missing target/release/cairn-bench after build"; exit 1; }
      - name: Run gates
        run: ./target/release/cairn-bench ${{ matrix.cmd }}
        env:
          CAIRN_MOCK_EMBEDDER: "1"
          # Use file-backed keystore on Linux runners — gnome-keyring +
          # Secret Service isn't pre-configured in GHA's ubuntu-latest
          # and our headless bench subprocesses need a working keystore.
          # macOS Keychain works headlessly via the OS keystore.
          CAIRN_KEYSTORE: ${{ matrix.runner == 'ubuntu-latest' && 'file' || '' }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-reports-${{ matrix.runner }}
          path: target/cairn-bench/*.json
          retention-days: 14

  coherence-gate:
    name: gates / coherence (§15, §18 #5, #137)
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need history so we can `git show` the base ref's trusted
          # baseline + manifest below.
          fetch-depth: 0
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: coherence-gate
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build cairn + cairn-bench binaries
        run: |
          cargo build --release --locked -p cairn-cli --bin cairn
          cargo build --release --locked -p cairn-bench
      - name: Resolve gate mode + trusted manifest/baseline
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        run: |
          # Pick gate mode and the trusted-input source per event.
          # Both pull_request and merge_group ship an immutable base SHA
          # in the payload — use that so a base-branch advance during the
          # run cannot retarget the trusted inputs at a different
          # baseline. Pushes and workflow_dispatch run on a trusted
          # branch already, so the in-tree files ARE the trusted tree.
          target_branch=""
          trusted_sha=""
          trust_from_base=0
          case "$EVENT_NAME" in
            pull_request)
              target_branch="$PR_BASE_REF"
              trusted_sha="$PR_BASE_SHA"
              trust_from_base=1
              ;;
            merge_group)
              target_branch="${MERGE_BASE_REF#refs/heads/}"
              trusted_sha="$MERGE_BASE_SHA"
              trust_from_base=1
              ;;
            *)
              target_branch="$PUSH_REF_NAME"
              ;;
          esac
          case "$target_branch" in
            release/*) mode="rc" ;;
            *)         mode="beta" ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          # HEAD-tree validation. Trust model:
          #   - manifest + baseline come from the trusted base SHA so a
          #     PR cannot lower floors or rewrite baselines.
          #   - cassettes come from HEAD so the gate evaluates this
          #     candidate's code+fixtures, but the coverage-regression
          #     guard in cairn-bench (CoverageRegression) compares HEAD
          #     totals against the trusted base baseline totals. A PR
          #     that strips actions or tags from any cassette will trip
          #     that guard before scoring.
          # The shell-side validation here only ensures the gate
          # invocation can actually run: files exist, are regular
          # (not symlinks), non-empty, and the cassettes carry the
          # metric_category tag.
          required_paths=(
            "crates/cairn-bench/manifests/coherence.toml"
            "crates/cairn-bench/baselines/coherence.json"
            "fixtures/v0/replay/research_domain.json"
            "fixtures/v0/replay/engineering_domain.json"
            "fixtures/v0/replay/support_domain.json"
          )
          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::coherence-gate: HEAD is missing required path '$path'"
              exit 1
            fi
            if [[ -L "$path" ]]; then
              echo "::error::coherence-gate: HEAD path '$path' is a symlink; refuse to follow (trust pinned to regular files)"
              exit 1
            fi
            if [[ ! -s "$path" ]]; then
              echo "::error::coherence-gate: HEAD path '$path' is empty"
              exit 1
            fi
          done
          for cassette in research_domain engineering_domain support_domain; do
            cassette_path="fixtures/v0/replay/${cassette}.json"
            if ! grep -q '"metric_category"' "$cassette_path"; then
              echo "::error::coherence-gate: HEAD cassette $cassette_path has no metric_category tags; coverage taxonomy stripped"
              exit 1
            fi
          done
          mkdir -p .ci-trusted
          if [[ "$trust_from_base" == "1" ]]; then
            # Fetch the exact immutable base SHA. Avoids the race where
            # `origin/$target_branch` advances between checkout and the
            # git-show below.
            git fetch --depth=1 origin "$trusted_sha"
            # Bootstrap guard: the trusted-input model assumes the base
            # SHA already carries the manifest, baseline, and tagged
            # cassettes. On the *very first* PR that introduces these
            # files, the base predates them; the strict `git show`
            # would abort and the PR could never land. Fall back to
            # in-tree manifest+baseline when missing on base, with a
            # visible warning. Once this PR merges, future PRs see the
            # trusted path. The HEAD validation above already prevents
            # a candidate from deleting the files while still passing.
            base_has_inputs=1
            base_manifest_path="crates/cairn-bench/manifests/coherence.toml"
            base_baseline_path="crates/cairn-bench/baselines/coherence.json"
            for path in "$base_manifest_path" "$base_baseline_path"; do
              if ! git cat-file -e "$trusted_sha:$path" 2>/dev/null; then
                base_has_inputs=0
                break
              fi
            done
            if [[ "$base_has_inputs" == "1" ]]; then
              git show "$trusted_sha:$base_manifest_path" > .ci-trusted/coherence.toml
              git show "$trusted_sha:$base_baseline_path" > .ci-trusted/coherence.json
              echo "manifest=.ci-trusted/coherence.toml" >> "$GITHUB_OUTPUT"
              echo "baseline=.ci-trusted/coherence.json" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::coherence-gate falling back to in-tree manifest/baseline (base $trusted_sha predates #137 — bootstrap path)"
              echo "manifest=$base_manifest_path" >> "$GITHUB_OUTPUT"
              echo "baseline=$base_baseline_path" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "manifest=crates/cairn-bench/manifests/coherence.toml" >> "$GITHUB_OUTPUT"
            echo "baseline=crates/cairn-bench/baselines/coherence.json" >> "$GITHUB_OUTPUT"
          fi
          echo "cassettes=fixtures/v0/replay" >> "$GITHUB_OUTPUT"
      - name: Verify HEAD manifest/baseline does not weaken trusted base
        # Only meaningful when we actually have trusted base inputs
        # (skipped during bootstrap fallback or push events to a
        # trusted branch where in-tree IS the trusted source).
        if: steps.gate.outputs.manifest == '.ci-trusted/coherence.toml'
        run: |
          ./target/release/cairn-bench coherence verify-drift \
            --head-manifest crates/cairn-bench/manifests/coherence.toml \
            --base-manifest .ci-trusted/coherence.toml \
            --head-baseline crates/cairn-bench/baselines/coherence.json \
            --base-baseline .ci-trusted/coherence.json
      - name: Run coherence gate
        run: |
          ./target/release/cairn-bench coherence run \
            --gate ${{ steps.gate.outputs.mode }} \
            --manifest ${{ steps.gate.outputs.manifest }} \
            --baseline ${{ steps.gate.outputs.baseline }} \
            --cassettes ${{ steps.gate.outputs.cassettes }}
        env:
          CAIRN_MOCK_EMBEDDER: "1"
          CAIRN_KEYSTORE: "file"
          GIT_SHA: ${{ github.sha }}
      - name: Upload coherence report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coherence-report
          path: crates/cairn-bench/baselines/coherence-trend.jsonl
          retention-days: 14

  lint-readonly-sources:
    name: invariant / lint never writes sources (§3, #257)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: scripts/check-lint-readonly-sources.sh
        run: ./scripts/check-lint-readonly-sources.sh

  os-locks:
    name: invariant / no OS advisory locks (§5.6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: scripts/check-no-os-locks.sh
        run: ./scripts/check-no-os-locks.sh

  filter-smoke:
    # Exercises §5.2 redact + fence against the *non-dev* dependency
    # graph. `cargo run --bin` does not activate dev-dependencies, so
    # this catches the regex feature-unification bug class — where a
    # missing feature in cairn-core's normal deps is masked at test
    # time by proptest / insta pulling the feature in transitively
    # but panics on first call from a downstream binary.
    name: smoke / cairn-core filter pipeline (no dev-deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: filter-smoke
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo run -p cairn-core --bin filter_smoke
        run: cargo run -p cairn-core --bin filter_smoke --features smoke --locked --release

  cli-mcp-smoke:
    name: smoke / cairn cli+mcp verb dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: cli-mcp-smoke
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test -p cairn-cli --test status_snapshot --test handshake_tests --test mcp_handshake_e2e
        run: cargo test -p cairn-cli --locked --test status_snapshot --test handshake_tests --test mcp_handshake_e2e

  plugins-verify:
    name: plugins / cairn plugins verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          shared-key: plugins-verify
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cairn plugins verify (default mode)
        run: cargo run -p cairn-cli --locked -- plugins verify
      - name: cairn plugins verify (json artifact)
        run: cargo run -p cairn-cli --locked -- plugins verify --json > plugins-verify.json
      - name: Upload plugins-verify.json
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugins-verify-${{ github.run_id }}
          path: plugins-verify.json
          retention-days: 14

  build:
    name: build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build-${{ matrix.os }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check --workspace --all-targets
        run: cargo check --workspace --all-targets --locked

  codegen-drift:
    name: codegen / no drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: codegen-drift
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo run -p cairn-idl --bin cairn-codegen -- --check
        run: cargo run -p cairn-idl --bin cairn-codegen --locked -- --check

  contract-drift:
    name: contract-drift / wire-compat + capability matrix (§8.0.a, §15, #98)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: contract-drift
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        # Avoid taiki-e/install-action@v2.75.21's BASH_FUNC_ guard which
        # currently false-positives on the GitHub-hosted runner image. Same
        # workaround as supply-chain.yml (cargo-machete).
        run: cargo install cargo-nextest --locked --version 0.9.136
      - name: cairn-codegen --check (IDL → generated)
        run: cargo run -p cairn-idl --bin cairn-codegen --locked -- --check
      - name: cairn-docgen --check (IDL → docs)
        run: cargo run -p cairn-cli --bin cairn-docgen --locked -- --check
      - name: wire-compat fixtures (manifest fingerprint + per-file + inventory)
        run: cargo-nextest nextest run -p cairn-idl --test wire_compat_v1 --locked
      - name: capability matrix v0.1 (pure advertise())
        run: cargo-nextest nextest run -p cairn-core --test capability_matrix_v1 --locked
      - name: per-surface status snapshots (CLI default + degraded configs)
        run: cargo-nextest nextest run -p cairn-cli --test status_snapshot_insta --locked
      - name: per-surface CLI ↔ SDK parity
        run: cargo-nextest nextest run -p cairn-cli --test sdk_cli_parity --locked
      - name: per-surface SDK transport capability filter
        # Whole `surface` test module — covers advertise / post-filter
        # (retrieve/forget) / unavailable fail-closed paths in one shot
        # so a future SDK-only capability regression cannot slip past a
        # too-narrow nextest filter. Issue #98 round-6 finding.
        run: cargo-nextest nextest run -p cairn-sdk --test surface --locked
      - name: per-surface MCP initialize ↔ status parity
        run: cargo-nextest nextest run -p cairn-mcp --test init_status_parity --locked

  bench-full:
    # Manual-trigger BrainBench scorecard run against the staged
    # world-v1 fixture (241 pages). Fetches the BGE model from
    # HuggingFace on first run; uses OPENAI_API_KEY if supplied as a
    # repo secret, otherwise the OpenAI column is skipped. Per-PR
    # coverage of cairn-bench lives in the regular `test` job
    # (unit tests in report::tests + cache::tests + adapter::tests).
    name: bench / world-v1 (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: bench-full
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cairn-bench (full corpus)
        env:
          BENCH_FETCH_MODELS: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            cargo run --release -p cairn-bench --features openai --locked -- \
              scorecard \
              --fixture fixtures/v0/brainbench-world-v1 \
              --out-dir target/bench-full
          else
            echo "OPENAI_API_KEY secret not set — running with --skip-openai."
            cargo run --release -p cairn-bench --locked -- \
              scorecard \
              --fixture fixtures/v0/brainbench-world-v1 \
              --out-dir target/bench-full --skip-openai
          fi
          test -f target/bench-full/report.md
          test -f target/bench-full/per-query.jsonl
          echo "::group::report.md"
          cat target/bench-full/report.md
          echo "::endgroup::"
      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brainbench-${{ github.run_id }}
