[workspace]
resolver = "3"
members = ["crates/*"]
# fuzz/ is a separate (non-workspace) package: cargo-fuzz needs
# nightly + sanitizer flags that are incompatible with the pinned
# MSRV. See fuzz/README.md for usage.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
authors = ["Cairn contributors"]
repository = "https://github.com/windoliver/cairn"
homepage = "https://github.com/windoliver/cairn"
readme = "README.md"

[workspace.dependencies]
aho-corasick = { version = "1", default-features = false, features = ["std", "perf-literal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "json", "fmt"] }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
rmcp = { version = "1.5.0", default-features = false, features = ["server", "transport-io"] }
include_dir = { version = "0.7", default-features = false }
insta = { version = "1.40", features = ["json", "yaml"] }
jsonschema = { version = "0.46", default-features = false }
referencing = { version = "0.46", default-features = false }
pretty_assertions = "1"
proptest = "1"
rstest = "0.23"
tempfile = "3"
semver = "1"
sha2 = { version = "0.10", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "display"] }
regex = { version = "1", default-features = false, features = ["std"] }
yaml_serde = "0.10.4"
unicode-normalization = "0.1"
temp-env = "0.3"
rusqlite = { version = "0.32", default-features = false, features = ["bundled", "blob", "chrono", "serde_json"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
rusqlite_migration = "1"
ulid = { version = "1.1", default-features = false, features = ["std"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
blake3 = { version = "1.5", default-features = false }
uuid = { version = "1", features = ["v4"] }
bon = "3.7"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
tokio_rusqlite = { package = "tokio-rusqlite", version = "0.6", default-features = false, features = ["bundled"] }
tokio-util = { version = "0.7", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
flate2 = "1"
tar = "0.4"
walkdir = "2"
# sqlite-vec ANN extension — statically compiled; the crate's build.rs
# compiles sqlite-vec.c with -DSQLITE_CORE so the vec0 module is always
# linked. Version pinned at 0.1.9 (last stable; 0.1.10-alpha series broke
# on macOS aarch64 during compilation).
sqlite-vec = "0.1.9"

# Embedding runtime — cairn-embeddings-local only
candle-core = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
candle-transformers = { version = "0.10", default-features = false }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
hf-hub = { version = "0.5", default-features = false, features = ["tokio"] }
safetensors = { version = "0.7", default-features = false }

# OpenAI-compat — cairn-llm-openai-compat
async-openai = { version = "0.36", default-features = false, features = ["rustls", "chat-completion"] }
# HTTP client shared by cairn-embeddings-openai (direct calls) and
# cairn-llm-openai-compat (alongside async-openai). The latter needs
# direct reqwest because `async-openai` discards HTTP status on
# `JSONDeserialize` errors (e.g. empty bodies), which blocks accurate
# 401/429/5xx disambiguation. async-openai is used for typed structs only.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream", "gzip"] }
futures-util = { version = "0.3", default-features = false }
wiremock = "0.6"
zeroize = { version = "1.7", default-features = false, features = ["zeroize_derive"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize", "rand_core"] }
rand_core = { version = "0.6", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
criterion = { version = "0.5", default-features = false, features = ["html_reports", "cargo_bench_support"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native", "windows-native"] }
parking_lot = "0.12"
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }
indexmap = "2"
fs2 = "0.4"
whoami = "1.5"
schemars = "1.0"
memchr = "2"
smallvec = "1"
nix = { version = "0.30", default-features = false, features = ["signal"] }
cpal = "0.17.3"
sherpa-onnx = { version = "1.13.1", default-features = false, features = ["static"] }
xcap = "0.9.4"
# Connector-framework deps (cairn-connectors-core, issue #130)
arc-swap = "1"
hmac = { version = "0.12", default-features = false }
subtle = { version = "2", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
url = { version = "2", default-features = false }

# Path + version on intra-workspace deps so `cargo publish` can rewrite the
# path to a registry version without losing the constraint. The version
# tracks `[workspace.package].version`; bump them together.
cairn-core = { path = "crates/cairn-core", version = "0.0.1" }
cairn-agent-core = { path = "crates/cairn-agent-core", version = "0.0.1" }
cairn-desktop = { path = "crates/cairn-desktop", version = "0.0.1" }
cairn-llm-openai-compat = { path = "crates/cairn-llm-openai-compat", version = "0.0.1" }
cairn-keychain = { path = "crates/cairn-keychain", version = "0.0.1" }
cairn-mcp = { path = "crates/cairn-mcp", version = "0.0.1" }
cairn-store-sqlite = { path = "crates/cairn-store-sqlite", version = "0.0.1" }
cairn-sensors-local = { path = "crates/cairn-sensors-local", version = "0.0.1" }
cairn-workflows = { path = "crates/cairn-workflows", version = "0.0.1" }
cairn-idl = { path = "crates/cairn-idl", version = "0.0.1" }
cairn-test-fixtures = { path = "crates/cairn-test-fixtures", version = "0.0.1" }
cairn-sdk = { path = "crates/cairn-sdk", version = "0.0.1" }
cairn-embeddings-local = { path = "crates/cairn-embeddings-local", version = "0.0.1" }
cairn-embeddings-openai = { path = "crates/cairn-embeddings-openai", version = "0.0.1" }
cairn-frontend-obsidian = { path = "crates/cairn-frontend-obsidian", version = "0.0.1" }
cairn-frontend-vscode = { path = "crates/cairn-frontend-vscode", version = "0.0.1" }
cairn-frontend-logseq = { path = "crates/cairn-frontend-logseq", version = "0.0.1" }
cairn-connectors-core = { path = "crates/cairn-connectors-core", version = "0.0.1" }
cairn-connectors-github = { path = "crates/cairn-connectors-github", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
