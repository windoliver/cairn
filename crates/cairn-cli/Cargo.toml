[package]
name = "cairn-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Cairn terminal entry point. Wires adapters into the verb layer."
default-run = "cairn"

[features]
default = []
# Opt-in: pulls cairn-embeddings-openai. When enabled, `cairn search` may
# resolve `search.default_provider = openai` to OpenAi's HTTP embedding
# endpoint (requires OPENAI_API_KEY). Default builds stay offline / local-only.
openai = ["dep:cairn-embeddings-openai"]

[[bin]]
name = "cairn"
path = "src/main.rs"

[[bin]]
name = "cairn-docgen"
path = "src/bin/cairn-docgen.rs"

[dependencies]
cairn-core = { workspace = true }
cairn-embeddings-local = { workspace = true }
cairn-embeddings-openai = { workspace = true, optional = true }
cairn-idl = { workspace = true }
cairn-keychain = { workspace = true }
cairn-mcp = { workspace = true }
cairn-store-sqlite = { workspace = true }
cairn-sensors-local = { workspace = true }
cairn-workflows = { workspace = true }
cairn-llm-openai-compat = { workspace = true }
tokio_rusqlite = { workspace = true }
anyhow = { workspace = true }
jsonschema = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "fs", "io-util"] }
rusqlite = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }
base64 = { workspace = true }
yaml_serde = { workspace = true }
toml = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
fs2 = { workspace = true }
rand_core = { workspace = true }
whoami = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
cairn-sdk = { workspace = true }
cairn-core = { workspace = true, features = ["test-helpers", "test-fixtures"] }
cairn-test-fixtures = { workspace = true }
cairn-store-sqlite = { workspace = true }
insta = { workspace = true }
async-trait = { workspace = true }
proptest = { workspace = true }
rusqlite = { workspace = true }
temp-env = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
assert_cmd = "2"
predicates = "3"
tokio = { workspace = true }

[lints]
workspace = true

[lib]
name = "cairn_cli"
path = "src/lib.rs"
