[package]
name = "cairn-embeddings-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Pure-Rust local embedding runtime for Cairn (candle BERT + ModelCache)."

[features]
default = []
# Gate real-weight integration tests behind this feature so CI stays fast.
real-models = []

[dependencies]
cairn-core = { path = "../cairn-core" }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true, features = ["ureq"] }
safetensors = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

# safetensors and serde are not directly imported with `use`, but are
# required as explicit deps: safetensors is needed by candle-nn's
# `from_buffered_safetensors` feature gate; serde enables `Deserialize` on
# candle-transformers' `BertConfig` when loaded via serde_json.
[package.metadata.cargo-machete]
ignored = ["safetensors", "serde"]
