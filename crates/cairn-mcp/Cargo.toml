[package]
name = "cairn-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "MCP adapter surface for the Cairn verb layer."

[dependencies]
cairn-core = { workspace = true }
cairn-store-sqlite = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
memchr = { workspace = true }
# Random secret generation for the stable host fingerprint backing the
# cross-machine restore guard (host-derived, not vault-derived; review #6.4).
uuid = { workspace = true }

[dev-dependencies]
cairn-test-fixtures = { workspace = true }
include_dir = { workspace = true }
insta = { workspace = true }
pretty_assertions = { workspace = true }
rand_core = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

# tokio: used transitively — rmcp::transport::io::stdio() returns tokio::io types;
#   direct tokio usage lands when cairn-cli wires the runtime.
[package.metadata.cargo-machete]
ignored = ["tokio"]
