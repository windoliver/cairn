[package]
name = "cairn-sensors-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Local sensors (IDE hook, terminal, clipboard, voice, screen) for Cairn."

[features]
default = []
voice-runtime = ["dep:cpal", "dep:sherpa-onnx"]
screenpipe-runtime = []

[dependencies]
cairn-core = { workspace = true }
async-trait = { workspace = true }
cpal = { workspace = true, optional = true }
regex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sherpa-onnx = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
xcap = { workspace = true }

[dev-dependencies]
cairn-test-fixtures = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

# Forward-declared scaffold deps. Drop entries as their first call site lands.
[package.metadata.cargo-machete]
ignored = ["tracing"]
