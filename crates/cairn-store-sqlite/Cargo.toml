[package]
name = "cairn-store-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "SQLite + FTS5 + sqlite-vec record store adapter for Cairn."

[dependencies]
cairn-core = { workspace = true }
async-trait = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "rt"] }
tokio_rusqlite = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
parking_lot = { workspace = true }

[features]
default = []
# Exposes sync `rusqlite::Connection` open helpers for integration tests.
# Not part of the production API — keeps the test surface explicit.
test-helpers = []

[dev-dependencies]
cairn-core = { workspace = true, features = ["test-fixtures", "test-helpers"] }
cairn-store-sqlite = { path = ".", features = ["test-helpers"] }
cairn-test-fixtures = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rand_core = { workspace = true }

[lints]
workspace = true

# Forward-declared scaffold deps. Drop entries as their first call site lands.
[package.metadata.cargo-machete]
ignored = ["thiserror", "chrono", "serde_json", "ed25519-dalek", "sha2", "ulid"]
