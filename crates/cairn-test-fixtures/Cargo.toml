[package]
name = "cairn-test-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Shared test helpers and fixture loaders for Cairn crates."

[dependencies]
async-trait = { workspace = true }
cairn-core = { workspace = true, features = ["test-fixtures", "test-helpers"] }
cairn-embeddings-local = { workspace = true }
cairn-store-sqlite = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
ulid = { workspace = true }
parking_lot = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rand_core = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

# cargo-machete scans library source, so it cannot see integration-test usage
# of cairn-core and flags it as unused. This ignore is permanent for this crate.
[package.metadata.cargo-machete]
ignored = ["cairn-core", "ed25519-dalek", "async-trait", "parking_lot"]
