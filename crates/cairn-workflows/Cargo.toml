[package]
name = "cairn-workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Background workflows host (consolidate, promote, expire, evaluate) for Cairn."

[dependencies]
cairn-core = { workspace = true }
# Required for the canonical migration-0020 SQL constant — the
# constructor hashes it to detect drift in the on-disk
# `schema_migrations.sql_hash` row for the `workflow_jobs` table.
# Pulling it through the package API keeps this crate self-contained
# when packaged for publish.
cairn-store-sqlite = { workspace = true }
async-trait = { workspace = true }
fs4 = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
cairn-store-sqlite = { workspace = true, features = ["test-helpers"] }
cairn-test-fixtures = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "test-util"] }

[lints]
workspace = true
