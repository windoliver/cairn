# cargo-deny policy for Cairn. Wired into the `supply-chain` workflow
# (.github/workflows/supply-chain.yml). Local equivalent: `cargo deny check`.

[licenses]
allow = [
    "Apache-2.0",
    # Apache-2.0 WITH LLVM-exception is used by target-lexicon, pulled in
    # transitively by xcap's Linux PipeWire dependency chain.
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    # MIT-0 = MIT without the attribution clause (strictly more permissive).
    # Pulled in transitively via referencing → fluent-uri → borrow-or-share
    # (jsonschema 0.46 dependency for cross-file $ref resolution in
    # cairn-idl skill-compat).
    "MIT-0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    # CDLA-Permissive-2.0 = Community Data License Agreement Permissive 2.0.
    # Pulled in via webpki-roots → candle-nn (cairn-embeddings-local) and
    # via reqwest → rustls-platform-verifier → async-openai. Permissive
    # community data license; no copyleft restrictions on use/distribution.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
# RUSTSEC-2024-0436: `paste` 1.0.x — unmaintained (informational, not a CVE).
#   Pulled in via gemm → candle-core → cairn-embeddings-local. Tracked
#   for future update (#48).
# RUSTSEC-2024-0384: `instant` crate is unmaintained, no safe upgrade.
# RUSTSEC-2025-0012: `backoff` crate is unmaintained, no safe upgrade.
#   Both transitive deps via async-openai → cairn-llm-openai-compat;
#   tracked for replacement when async-openai migrates away.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2024-0384", "RUSTSEC-2025-0012"]

# Deny-by-default for dependency sources. Without this, the
# `cargo-deny check sources` step in supply-chain.yml only warns on
# unknown git or registry sources — a PR could add an arbitrary git
# dependency and still pass the required gate.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
